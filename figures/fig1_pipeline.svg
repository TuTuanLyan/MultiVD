<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="anchor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6a49"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>

  <!-- phase panels -->
  <rect x="28" y="56" width="430" height="516" rx="8" fill="#f7f9fb" stroke="#c9d3dd"/>
  <rect x="522" y="56" width="430" height="516" rx="8" fill="#f7f9fb" stroke="#c9d3dd"/>
  <text x="243" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202a">PHASE 1 — multitask pretraining trên source</text>
  <text x="737" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202a">PHASE 2 — RecAdam fine-tune trên target</text>

  <!-- ============ PHASE 1 ============ -->
  <rect x="78" y="104" width="330" height="46" rx="5" fill="#fff" stroke="#333"/>
  <text x="243" y="124" text-anchor="middle" font-size="13" fill="#111">Source corpus  (C/C++ , JS)</text>
  <text x="243" y="141" text-anchor="middle" font-size="11" fill="#667">tokenize · max_len 512 · head_middle_tail</text>
  <line x1="243" y1="150" x2="243" y2="174" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="78" y="176" width="330" height="58" rx="5" fill="#eef2f7" stroke="#333" stroke-width="1.6"/>
  <text x="243" y="199" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">BACKBONE / ENCODER</text>
  <text x="243" y="216" text-anchor="middle" font-size="10.5" fill="#556">T5-family: chỉ nạp encoder, decoder bị bỏ (T5EncoderModel)</text>
  <text x="243" y="228" text-anchor="middle" font-size="10.5" fill="#556">→ last_hidden_state [B, L, H],  H = 768</text>
  <line x1="243" y1="234" x2="243" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="78" y="260" width="330" height="44" rx="5" fill="#fff" stroke="#333"/>
  <text x="243" y="279" text-anchor="middle" font-size="13" fill="#111">POOL  →  [B, H]</text>
  <text x="243" y="295" text-anchor="middle" font-size="10.5" fill="#556">cls = vị trí 0 (token &lt;s&gt;)   |   mean = trung bình có mask</text>
  <line x1="243" y1="304" x2="243" y2="326" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="150" y="328" width="186" height="30" rx="5" fill="#fff" stroke="#333"/>
  <text x="243" y="348" text-anchor="middle" font-size="12" fill="#111">Dropout (0.1)</text>

  <!-- split -->
  <line x1="243" y1="358" x2="243" y2="376" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="376" x2="336" y2="376" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="376" x2="150" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="336" y1="376" x2="336" y2="398" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aux)"/>

  <rect x="72" y="400" width="156" height="44" rx="5" fill="#fff" stroke="#333"/>
  <text x="150" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">vul_head</text>
  <text x="150" y="435" text-anchor="middle" font-size="11" fill="#556">Linear(H, 2)</text>

  <rect x="258" y="400" width="156" height="44" rx="5" fill="#fdf6ec" stroke="#b45309" stroke-dasharray="5 3"/>
  <text x="336" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4a08">AUX HEAD</text>
  <text x="336" y="435" text-anchor="middle" font-size="10.5" fill="#8a4a08">4 biến thể — xem Hình 2</text>

  <line x1="150" y1="444" x2="150" y2="466" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="336" y1="444" x2="336" y2="466" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aux)"/>
  <text x="150" y="482" text-anchor="middle" font-size="12" fill="#111">L_bin</text>
  <text x="336" y="482" text-anchor="middle" font-size="12" fill="#8a4a08">L_aux</text>

  <rect x="90" y="496" width="306" height="34" rx="5" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="243" y="518" text-anchor="middle" font-size="13.5" fill="#111">L = L_bin + λ·L_aux,   λ = 0.2</text>

  <text x="243" y="552" text-anchor="middle" font-size="11.5" fill="#556">lưu checkpoint nguồn  θ*  (backbone + cả hai head)</text>

  <!-- ============ transfer arrow ============ -->
  <line x1="458" y1="300" x2="520" y2="300" stroke="#1d6a49" stroke-width="2.2" marker-end="url(#anchor)"/>
  <text x="489" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6a49">θ*</text>

  <!-- ============ PHASE 2 ============ -->
  <rect x="572" y="104" width="330" height="46" rx="5" fill="#fff" stroke="#333"/>
  <text x="737" y="124" text-anchor="middle" font-size="13" fill="#111">Target fold  (Python — twin folds)</text>
  <text x="737" y="141" text-anchor="middle" font-size="11" fill="#667">456 train / 152 val / 152 test</text>
  <line x1="737" y1="150" x2="737" y2="174" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="572" y="176" width="330" height="58" rx="5" fill="#eef2f7" stroke="#1d6a49" stroke-width="1.8"/>
  <text x="737" y="199" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">BACKBONE / ENCODER</text>
  <text x="737" y="216" text-anchor="middle" font-size="10.5" fill="#1d6a49">khởi tạo từ θ*  ·  huấn luyện tiếp</text>
  <text x="737" y="228" text-anchor="middle" font-size="10.5" fill="#556">→ last_hidden_state  [B, L, H]</text>
  <line x1="737" y1="234" x2="737" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="572" y="260" width="330" height="44" rx="5" fill="#fff" stroke="#333"/>
  <text x="737" y="279" text-anchor="middle" font-size="13" fill="#111">POOL  →  [B, H]</text>
  <text x="737" y="295" text-anchor="middle" font-size="10.5" fill="#556">cùng chiến lược pooling với Phase 1</text>
  <line x1="737" y1="304" x2="737" y2="326" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="644" y="328" width="186" height="30" rx="5" fill="#fff" stroke="#333"/>
  <text x="737" y="348" text-anchor="middle" font-size="12" fill="#111">Dropout (0.1)</text>
  <line x1="737" y1="358" x2="737" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="659" y="400" width="156" height="44" rx="5" fill="#fff" stroke="#1d6a49" stroke-width="1.6"/>
  <text x="737" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">vul_head</text>
  <text x="737" y="435" text-anchor="middle" font-size="11" fill="#556">Linear(H, 2)  · từ θ*</text>

  <!-- frozen aux -->
  <rect x="830" y="400" width="108" height="44" rx="5" fill="#f1f1f1" stroke="#999" stroke-dasharray="4 3"/>
  <text x="884" y="418" text-anchor="middle" font-size="11" fill="#777">AUX HEAD</text>
  <text x="884" y="434" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777">ĐÓNG BĂNG</text>
  <text x="884" y="458" text-anchor="middle" font-size="9.5" fill="#999">không dùng lúc</text>
  <text x="884" y="469" text-anchor="middle" font-size="9.5" fill="#999">inference</text>

  <line x1="737" y1="444" x2="737" y2="466" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="737" y="482" text-anchor="middle" font-size="12" fill="#111">L_target</text>

  <rect x="560" y="496" width="354" height="52" rx="5" fill="#fff" stroke="#1d6a49" stroke-width="1.4"/>
  <text x="737" y="516" text-anchor="middle" font-size="13" fill="#111">L = λ(t)·L_target + (1−λ(t))· (γ/2)·Σ (θᵢ − θ*ᵢ)²</text>
  <text x="737" y="536" text-anchor="middle" font-size="11" fill="#1d6a49">RecAdam — λ(t) sigmoid, hiệu chỉnh theo total_steps</text>

  <text x="737" y="566" text-anchor="middle" font-size="11" fill="#556">θ* neo backbone lại phía nguồn, giảm dần theo thời gian</text>

  <text x="490" y="612" text-anchor="middle" font-size="11.5" fill="#667">Hình 1 — Pipeline hai pha. Head phụ chỉ tồn tại ở Phase 1; hình dạng của nó không ràng buộc target.</text>
</svg>
