<title>Tóm tắt kết quả MultiVD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f5f6; --card:#fff; --card2:#fafbfb; --ink:#161b1f; --ink2:#3f4b52; --ink3:#6f7c84;
  --rule:#dde1e4; --rule2:#eef0f2;
  --acc:#12605f; --acc-s:#e3efee;
  --gain:#1a6b45; --gain-s:#e2efe8; --loss:#9d3226; --loss-s:#f7e6e3;
  --warn:#8a5a09; --warn-s:#f9f0da;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1114; --card:#151b1f; --card2:#111619; --ink:#eceff0; --ink2:#b0bbc1; --ink3:#7c888f;
  --rule:#263036; --rule2:#1b2328; --acc:#49bdb7; --acc-s:#0f2e2d;
  --gain:#4fc78a; --gain-s:#0f3123; --loss:#e8867a; --loss-s:#331816;
  --warn:#d8a441; --warn-s:#2c2310;
}}
:root[data-theme="dark"]{
  --paper:#0d1114; --card:#151b1f; --card2:#111619; --ink:#eceff0; --ink2:#b0bbc1; --ink3:#7c888f;
  --rule:#263036; --rule2:#1b2328; --acc:#49bdb7; --acc-s:#0f2e2d;
  --gain:#4fc78a; --gain-s:#0f3123; --loss:#e8867a; --loss-s:#331816;
  --warn:#d8a441; --warn-s:#2c2310;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
 font:400 15px/1.55 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:30px 18px 80px;display:flex;flex-direction:column;gap:26px}
.prose{max-width:74ch}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--ink3)}
h1{font-size:clamp(26px,4.2vw,36px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:.3em 0 0}
h2{font-size:18px;font-weight:600;margin:0 0 9px;padding-bottom:7px;border-bottom:1.5px solid var(--rule)}
p{margin:0 0 10px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:15px 17px}
code{font-family:"IBM Plex Mono",monospace;font-size:.88em;background:var(--rule2);padding:1px 5px;border-radius:3px}

/* chu giai 1 dong */
dl.gl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:baseline}
dl.gl dt{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--acc);white-space:nowrap}
dl.gl dd{margin:0;font-size:13.5px;color:var(--ink2)}

/* thanh dieu khien */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
select,input[type=search]{font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--rule);
 border-radius:4px;background:var(--card);color:var(--ink)}
button{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--rule);border-radius:4px;
 background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] button.on{color:#0d1114}
label.chk{font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);margin-left:auto}

/* bang tong hop */
.tw{overflow:auto;max-height:64vh;border:1px solid var(--rule);border-radius:5px;background:var(--card)}
table.sm{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.sm th,table.sm td{padding:6px 8px;border-bottom:1px solid var(--rule2);white-space:nowrap;text-align:right}
table.sm th:first-child,table.sm td:first-child{text-align:left;white-space:normal;min-width:230px}
table.sm thead th{position:sticky;top:0;z-index:2;background:var(--card2);font-size:10.5px;
 letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;
 border-bottom:1.5px solid var(--rule);cursor:pointer;user-select:none}
table.sm thead th:hover{color:var(--acc)}
table.sm tbody tr:hover{background:var(--acc-s)}
td.v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.sg{font-size:9.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace;display:block}
.g{color:var(--gain);font-weight:600}.l{color:var(--loss);font-weight:600}.n{color:var(--ink3)}
.mt{font-size:11px;color:var(--ink3);display:block;margin-top:1px}
tr.key td{background:var(--acc-s)}

/* 2 bang — PHAI vua mot man hinh */
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.pane{border:1px solid var(--rule);border-radius:5px;padding:10px;background:var(--card2)}
.pane h3{margin:0 0 7px;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 6px;border-radius:9px;
 background:var(--acc);color:#fff}
.split table.sm{font-size:11px}
.split table.sm th,.split table.sm td{padding:4px 5px}
.split table.sm th:first-child,.split table.sm td:first-child{min-width:150px;font-size:11px}
.split .tw{max-height:56vh}
.split .bar select,.split .bar button{font-size:11px;padding:3px 6px;max-width:130px}
.split .bar label.chk{font-size:11px}

.key-box{border-left:3px solid var(--acc);background:var(--acc-s);padding:12px 14px;border-radius:0 4px 4px 0}
.key-box p{margin:0;font-size:14px}
.note{border-left:3px solid var(--warn);background:var(--warn-s);padding:12px 14px;border-radius:0 4px 4px 0;font-size:13.5px}
.note strong{color:var(--warn)}
ol,ul{margin:6px 0;padding-left:19px}li{margin-bottom:5px;font-size:14px}
footer{border-top:1px solid var(--rule);padding-top:13px;font-size:11.5px;color:var(--ink3);
 font-family:"IBM Plex Mono",monospace;line-height:1.65}
a{color:var(--acc)}
.ms{display:inline-block}
button.msb{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--rule);
 border-radius:4px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
button.msb:hover{border-color:var(--acc)}
button.msb.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.msp{position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:var(--card);
 border:1px solid var(--rule);border-radius:5px;padding:7px;min-width:170px;max-height:260px;
 overflow:auto;box-shadow:0 6px 22px rgba(0,0,0,.16)}
.msp label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 3px;
 white-space:nowrap;cursor:pointer;color:var(--ink2)}
.msp label:hover{color:var(--acc)}
.msf{display:flex;gap:5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule2)}
.msf button{font-size:11px;padding:3px 7px}
.split .msp{min-width:140px;font-size:11px}
.split button.msb{font-size:11px;padding:3px 6px}
</style>
