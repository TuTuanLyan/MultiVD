# Môi trường chuẩn của MultiVD — dựng lại bằng một lệnh.
#
#   conda env create -f environment.yml -p <đường_dẫn_env>
#     161: conda env create -f environment.yml -p ~/miniconda3/envs/vdenv
#     158: conda env create -f environment.yml -p /data/ntat/envs/vdenv
#
# ⚠️  TRÊN MÁY 158 KHÔNG DÙNG `conda activate vdenv`.
#     Máy 158 (flink-tm) có HAI môi trường cùng tên `vdenv`, và cái đăng ký dưới
#     tên đó là của đồng nghiệp, dùng torch 2.6.0+cu124 — KHÁC hẳn của ta.
#     Luôn gọi bằng đường dẫn đầy đủ: /data/ntat/envs/vdenv/bin/python
#     Trên 161 (flink-jm) thì `conda activate vdenv` là đúng.
#
# Xuất ngày 2026-09-24 từ /data/ntat/envs/vdenv (máy 158), sau khi đồng bộ với
# /home/ntat/miniconda3/envs/vdenv (máy 161). 49 gói thuộc đường chạy thí nghiệm
# trùng khớp tuyệt đối giữa hai máy.
#
# Hai điều đã sửa so với bản `conda env export` thô:
#   1. Phiên bản trong mục pip lấy từ `pip list --format=freeze`, vì conda viết
#      sai hậu tố .post (thop 0.1.1.post2209072238 -> 0.1.1-2209072238, cài lỗi).
#   2. Mục pip chỉ chứa 82 gói THẬT SỰ do pip cài (conda list ghi
#      channel = pypi). Không lặp lại gói do conda cài, tránh pip đè lên conda.
#
# CUDA bị ghim qua 15 gói nvidia-*-cu12 (12.8.x) + triton 3.5.1, nên torch==2.9.1
# sẽ kéo đúng bản cu128 (torch.__version__ báo '2.9.1+cu128').
#
# Gói chỉ có trên 161 (vastai, borb, CairoSVG, lxml, cryptography…) là công cụ
# riêng của máy local, CỐ Ý không đưa vào để môi trường tái hiện gọn.
